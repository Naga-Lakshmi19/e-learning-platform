<!DOCTYPE html>
<html>
<head>
    <title>Add Lesson</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* Navbar */
        .navbar {
            background: rgba(0,0,0,0.9);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: #00d4ff;
            font-size: 22px;
            font-weight: bold;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .nav-links a:hover {
            color: #00d4ff;
        }

        /* Background */
        .hero {
            height: 90vh;
            background: url("https://images.unsplash.com/photo-1523240795612-9a054b0db644") no-repeat center center/cover;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Form Card */
        .form-box {
            background: rgba(0,0,0,0.75);
            padding: 40px;
            border-radius: 10px;
            width: 400px;
            color: white;
            text-align: center;
        }

        .form-box h2 {
            margin-bottom: 20px;
        }

        select, input, textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: none;
        }

        textarea {
            resize: none;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #00d4ff;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #009ec3;
        }
    </style>

</head>
<body>

<!-- Navbar -->
<div class="navbar">
    <div class="logo">Admin Panel</div>
    <div class="nav-links">
        <a href="/dashboard/">Dashboard</a>
        <a href="/lessons/">View Lessons</a>
        <a href="/logout/">Logout</a>
    </div>
</div>

<!-- Add Lesson Form -->
<div class="hero">
    <div class="form-box">

        <h2>Add New Lesson</h2>

        <form method="POST" enctype="multipart/form-data">
{% csrf_token %}

<select name="subject_id">
{% for subject in subjects %}
<option value="{{ subject.id }}">{{ subject.name }}</option>
{% endfor %}
</select>

<input type="text" name="title" placeholder="Lesson title">

<textarea name="content" rows="6"></textarea>

<input type="file" name="image">

<button type="submit">Add Lesson</button>

</form>
{% if error %}
<p style="color:red">{{ error }}</p>
{% endif %}

{% if success %}
<p style="color:green">{{ success }}</p>
{% endif %}
    </div>
</div>

</body>
</html>
