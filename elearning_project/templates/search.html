<!DOCTYPE html>
<html>
<head>
    <title>Search Lessons</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* Navbar */
        .navbar {
            background: rgba(0,0,0,0.9);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: #00d4ff;
            font-size: 22px;
            font-weight: bold;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .nav-links a:hover {
            color: #00d4ff;
        }

        /* Background */
        .hero {
            min-height: 90vh;
            background: url("https://images.unsplash.com/photo-1523240795612-9a054b0db644") no-repeat center center/cover;
            padding: 40px;
        }

        h2 {
            text-align: center;
            color: white;
            margin-bottom: 20px;
        }

        /* Search Box */
        .search-box {
            text-align: center;
            margin-bottom: 30px;
        }

        input[type="text"] {
            width: 300px;
            padding: 10px;
            border-radius: 5px;
            border: none;
        }

        button {
            padding: 10px 15px;
            background: #00d4ff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #009ec3;
        }

        /* Results */
        .results-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: auto;
        }

        .result-card {
            background: rgba(0,0,0,0.75);
            color: white;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            transition: 0.3s;
        }

        .result-card:hover {
            transform: scale(1.05);
        }

        .btn {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 20px;
            background: #00d4ff;
            color: black;
            text-decoration: none;
            border-radius: 5px;
        }

        .btn:hover {
            background: #009ec3;
        }
    </style>

</head>
<body>

<!-- Navbar -->
<div class="navbar">
    <div class="logo">E-Learning</div>

    <div class="nav-links">
        <a href="/user-dashboard/">Dashboard</a>
        <a href="/learn/">Subjects</a>
        <a href="/bookmarks/">Bookmarks</a>
        <a href="/history/">History</a>
        <a href="/chat/">Chatbot</a>
        <a href="/user-logout/">Logout</a>
    </div>
</div>

<!-- Search Section -->
<div class="hero">

    <h2>Search Lessons</h2>

    <div class="search-box">
        <form method="GET">
            <input type="text" name="q" placeholder="Search lessons..." value="{{ request.GET.q }}">
            <button type="submit">Search</button>
        </form>
    </div>

    <div class="results-container">
        {% if results %}
            {% for lesson in results %}
            <div class="result-card">
                <h3>{{ lesson.title }}</h3>
                <p>{{ lesson.subject.name }}</p>

                <a href="/lesson/{{ lesson.id }}/" class="btn">Open Lesson</a>
            </div>
            {% endfor %}
        {% else %}
            <p style="color:white; text-align:center;">No results found.</p>
        {% endif %}
    </div>

</div>

</body>
</html>
