<!DOCTYPE html>
<html>
<head>
    <title>Contact Admin</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* Navbar */
        .navbar {
            background: rgba(0,0,0,0.9);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: #00d4ff;
            font-size: 22px;
            font-weight: bold;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .nav-links a:hover {
            color: #00d4ff;
        }

        /* Background */
        .hero {
            height: 90vh;
            background: url("https://images.unsplash.com/photo-1523240795612-9a054b0db644") no-repeat center center/cover;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Contact Card */
        .contact-box {
            background: rgba(0,0,0,0.75);
            padding: 40px;
            border-radius: 10px;
            width: 400px;
            color: white;
            text-align: center;
        }

        .contact-box h2 {
            margin-bottom: 20px;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: none;
        }

        textarea {
            resize: none;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #00d4ff;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #009ec3;
        }

        .msg {
            margin-top: 10px;
            color: #90ee90;
        }
    </style>

</head>
<body>

<!-- Navbar -->
<div class="navbar">
    <div class="logo">E-Learning</div>

    <div class="nav-links">
        <a href="/user-dashboard/">Dashboard</a>
        <a href="/learn/">Subjects</a>
        <a href="/chat/">Chatbot</a>
        <a href="/user-logout/">Logout</a>
    </div>
</div>

<!-- Contact Section -->
<div class="hero">
    <div class="contact-box">

        <h2>Contact Admin</h2>

        <form method="POST">
            {% csrf_token %}

            <input type="text" name="name" placeholder="Your Name" required>

            <input type="email" name="email" placeholder="Your Email" required>

            <textarea name="message" rows="5" placeholder="Type your message..." required></textarea>

            <button type="submit">Send Message</button>
        </form>

        {% if success %}
        <p class="msg">Message sent successfully!</p>
        {% endif %}

    </div>
</div>

</body>
</html>
