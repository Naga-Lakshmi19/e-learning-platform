<!DOCTYPE html>
<html>
<head>
    <title>Upload Study PDF</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* Navbar */
        .navbar {
            background: rgba(0,0,0,0.9);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: #00d4ff;
            font-size: 22px;
            font-weight: bold;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .nav-links a:hover {
            color: #00d4ff;
        }

        /* Background */
        .hero {
            height: 90vh;
            background: url("https://images.unsplash.com/photo-1523240795612-9a054b0db644") no-repeat center center/cover;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Upload Card */
        .upload-box {
            background: rgba(0,0,0,0.75);
            padding: 40px;
            border-radius: 10px;
            width: 400px;
            color: white;
            text-align: center;
        }

        .upload-box h2 {
            margin-bottom: 20px;
        }

        input[type="text"],
        input[type="file"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: none;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #00d4ff;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #009ec3;
        }

        .link {
            margin-top: 15px;
            display: block;
            color: #00d4ff;
            text-decoration: none;
        }

        .link:hover {
            text-decoration: underline;
        }
    </style>

</head>
<body>

<!-- Navbar -->
<div class="navbar">
    <div class="logo">E-Learning</div>

    <div class="nav-links">
        <a href="/user-dashboard/">Dashboard</a>
        <a href="/learn/">Subjects</a>
        <a href="/chat/">Chatbot</a>
        <a href="/user-logout/">Logout</a>
    </div>
</div>

<!-- Upload Section -->
<div class="hero">
    <div class="upload-box">

        <h2>Upload Study PDF</h2>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <input type="text" name="title" placeholder="Enter PDF Title" required>

            <input type="file" name="file" required>

            <button type="submit">Upload PDF</button>
        </form>

        <a href="/ask-pdf/" class="link">Ask Questions From PDF →</a>

    </div>
</div>

</body>
</html>
