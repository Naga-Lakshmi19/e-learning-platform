<!DOCTYPE html>
<html>
<head>
    <title>User Registration</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* Navbar */
        .navbar {
            background: rgba(0,0,0,0.85);
            color: white;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            color: #00d4ff;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 16px;
        }

        .navbar a:hover {
            color: #00d4ff;
        }

        /* Background Section */
        .hero {
            height: 90vh;
            background: url("https://images.unsplash.com/photo-1523240795612-9a054b0db644") no-repeat center center/cover;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Form Card */
        .form-box {
            background: rgba(0,0,0,0.7);
            padding: 40px;
            border-radius: 10px;
            color: white;
            width: 350px;
            text-align: center;
        }

        .form-box h2 {
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #00d4ff;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #009ec3;
        }

        .back {
            display: block;
            margin-top: 15px;
            color: #00d4ff;
            text-decoration: none;
        }

        .back:hover {
            text-decoration: underline;
        }
    </style>

</head>
<body>

<!-- Navbar -->
<div class="navbar">
    <h2>E-Learning</h2>
    <div>
        <a href="/">Home</a>
        <a href="/user-login/">Login</a>
        <a href="/contact/">Contact</a>
    </div>
</div>

<!-- Registration Form -->
<div class="hero">
    <div class="form-box">

        <h2>Create Account</h2>

        <form method="POST">
            {% csrf_token %}

            <input type="text" name="name" placeholder="Full Name" required>

            <input type="email" name="email" placeholder="Email Address" required>

            <input type="password" name="password" placeholder="Password" required>

            <button type="submit">Register</button>
        </form>

        <a class="back" href="/">← Back to Home</a>

    </div>
</div>

</body>
</html>
