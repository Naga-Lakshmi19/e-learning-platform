<!DOCTYPE html>
<html>
<head>
    <title>Lessons</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* Navbar */
        .navbar {
            background: rgba(0,0,0,0.9);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: #00d4ff;
            font-size: 22px;
            font-weight: bold;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .nav-links a:hover {
            color: #00d4ff;
        }

        /* Background */
        .hero {
            min-height: 90vh;
            background: url("https://images.unsplash.com/photo-1523240795612-9a054b0db644") no-repeat center center/cover;
            padding: 40px;
        }

        h2 {
            text-align: center;
            color: white;
            margin-bottom: 10px;
        }

        /* Progress */
        .progress-box {
            max-width: 600px;
            margin: 20px auto;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 8px;
            color: white;
            text-align: center;
        }

        .progress-bar {
            height: 20px;
            background: #ddd;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: #00d4ff;
            width: {{ progress_percent }}%;
        }

        /* Lesson Cards */
        .lessons-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: auto;
        }

        .lesson-card {
            background: rgba(0,0,0,0.75);
            color: white;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            transition: 0.3s;
        }

        .lesson-card:hover {
            transform: scale(1.05);
        }

        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background: #00d4ff;
            color: black;
            text-decoration: none;
            border-radius: 5px;
        }

        .btn:hover {
            background: #009ec3;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<div class="navbar">
    <div class="logo">E-Learning</div>

    <div class="nav-links">
        <a href="/user-dashboard/">Dashboard</a>
        <a href="/learn/">Subjects</a>
        <a href="/bookmarks/">Bookmarks</a>
        <a href="/history/">History</a>
        <a href="/chat/">Chatbot</a>
        <a href="/user-logout/">Logout</a>
    </div>
</div>

<!-- Lessons Section -->
<div class="hero">

    <h2>{{ subject.name }} - Lessons</h2>

    <!-- Progress -->
    <div class="progress-box">
        <b>Progress: {{ progress_percent }}%</b>

        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>
    </div>

    <!-- Lessons -->
    <div class="lessons-container">
        {% for lesson in lessons %}
        <div class="lesson-card">
            <h3>{{ lesson.title }}</h3>

            <a href="/lesson/{{ lesson.id }}/" class="btn">Open Lesson</a>
        </div>
        {% endfor %}
    </div>

</div>

</body>
</html>
