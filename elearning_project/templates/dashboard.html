<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* Navbar */
        .navbar {
            background: rgba(0,0,0,0.9);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: #00d4ff;
            font-size: 22px;
            font-weight: bold;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 15px;
        }

        .nav-links a:hover {
            color: #00d4ff;
        }

        /* Background */
        .hero {
            height: 90vh;
            background: url("https://images.unsplash.com/photo-1523240795612-9a054b0db644") no-repeat center center/cover;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* Welcome Box */
        .welcome-box {
            background: rgba(0,0,0,0.65);
            padding: 50px;
            border-radius: 10px;
            color: white;
        }

        .welcome-box h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .welcome-box p {
            font-size: 18px;
            color: #ddd;
        }
    </style>

</head>
<body>

<!-- Navbar with All Buttons -->
<div class="navbar">
    <div class="logo">Admin Panel</div>

    <div class="nav-links">
        <a href="/add-subject/">Add Subject</a>
        <a href="/subjects/">View Subjects</a>

        <a href="/add-lesson/">Add Lesson</a>
        <a href="/lessons/">View Lessons</a>

        <a href="/add-qa/">Chat Q&A</a>

        <a href="/admin-messages/">Contact Messages</a>
        <a href="/view-users/">Users</a>

        <a href="/logout/">Logout</a>
    </div>
</div>

<!-- Center Content -->
<div class="hero">
    <div class="welcome-box">
        <h1>Welcome Admin</h1>
        <p>Manage courses, lessons, chatbot knowledge, and learning content.</p>
    </div>
</div>

</body>
</html>
